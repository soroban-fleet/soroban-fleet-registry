services:
  postgres:
    image: postgres:16-alpine
    container_name: sfr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sfr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sfrpassword}
      POSTGRES_DB: ${POSTGRES_DB:-sfr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sfr} -d ${POSTGRES_DB:-sfr}"]
      interval: 5s
      timeout: 5s
      retries: 5

  sfr:
    build: .
    container_name: sfr-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SFR_NETWORK: "${SFR_NETWORK:-testnet}"
      SFR_RPC_URL: "${SFR_RPC_URL:-https://soroban-testnet.stellar.org}"
      SFR_DATABASE_URL: "${SFR_DATABASE_URL:-postgres://sfr:sfrpassword@postgres:5432/sfr?sslmode=disable}"
      SFR_LOG_LEVEL: "${SFR_LOG_LEVEL:-info}"
      SFR_HTTP_ADDR: ":8080"
      SFR_INDEXER_START_LEDGER: "${SFR_INDEXER_START_LEDGER:-1000}"
      SFR_INDEXER_BATCH_SIZE: "${SFR_INDEXER_BATCH_SIZE:-50}"
      SFR_CORS_ALLOWED_ORIGINS: "${SFR_CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
    ports:
      - "${SFR_HTTP_PORT:-8080}:8080"

volumes:
  postgres_data:
