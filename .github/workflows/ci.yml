name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Vet, and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sfr
          POSTGRES_PASSWORD: sfrpassword
          POSTGRES_DB: sfr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sfr -d sfr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Verify Formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not properly formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          SFR_DATABASE_URL: postgres://sfr:sfrpassword@localhost:5432/sfr_test?sslmode=disable
        run: go test -v -race -p 1 ./...

      - name: Deployment Smoke Checks
        env:
          SFR_DATABASE_URL: postgres://sfr:sfrpassword@localhost:5432/sfr_test?sslmode=disable
        run: |
          make build
          ./bin/sfr migrate down
          ./bin/sfr migrate up
          ./bin/sfr --help > /dev/null


  frontend:
    name: Frontend Lint, Test, and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build Application
        run: npm run build

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Documentation Site
        run: npm run build

